name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
